name: Import safety checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git clone --depth 1 --branch v0.1.12 https://github.com/pingdotgg/t3code.git work/t3code
      - run: npm run build:adapter
      - run: npm test
      - run: git diff --exit-code -- vendor/
